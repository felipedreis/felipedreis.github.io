skills: 
  - title: Technologies 
    details: |
      My main programming language through the last few years is Java, although I have some experience with C/C++, Python and currently
      learning Golang. I have experience with a variety of databases, message queues and deployment infrastructure. 
  - title: Problem Solving
    details: |
      I competed in the ICPC from 2014 to 2019, placing 3rd in the Maratona Mineira de Programação 2016 (Uberaba), and coached
      CEFET-MG teams until 2021, taking teams to the Brazilian national finals in 2017 and 2019. My favorite problem solving topics are
      dynamic programming and graphs.
  - title: Distributed Systems
    details: |
      I'm keen on this topic, having started working with it in 2010 inside the multi-agents domain. From the High-Performance Computing Lab
      to the banking sector, and current research projects in self-driving cars, all my experience is someway connected to distributed software.

jobs:
  - company: Five9
    roles:
      - position: Senior Software Engineer, Agentic Trust
        start: Aug, 2026
        description: |
          Promoted to Senior Software Engineer. I own the core of Agentic Quality Management (AQM): evaluation forms
          and rules, the scoring pipeline, and the agent-performance data warehouse, which I'm designing in BigQuery
          with the reporting team to back customer reports and dashboards.
      - position: Software Engineer II, Agentic Trust
        start: Feb, 2025
        end: Aug, 2026
        description: |
          I joined the Agentic Trust team to develop the Agentic Quality Management (AQM) product, leveraging LLMs
          to automate the performance evaluation of call center agents. I designed the form storage and the evaluation
          engine that applies customer-defined forms and rules to interactions, moving quality assurance from manual
          sampling of a small fraction of interactions to nearly all of them for 20 beta customers.
      - position: Software Engineer II, Outbound
        start: Aug, 2023
        end: Feb, 2025
        description: |
          I joined Five9 in the Outbound team. We were migrating outbound campaign list management from a Java 8
          monolith to Google Cloud while maintaining and evolving the monolith. I co-designed, implemented and tested
          end time to call, a compliance feature that stops dialing contacts after their chosen cutoff time, enforced
          in the calling queue and campaign management. I also fixed several bugs in the monolith related to the sorting
          and ordering criteria of campaigns.
          I also worked on the observability of the monolith in the cloud, designing and implementing the telemetry
          writer service that ingests ~200 OpenTelemetry events/s (~17M/day) across 4 production sectors from Pub/Sub
          into BigQuery tables, powering Grafana dashboards.
        tech:
          - Java
          - Spring
          - Google Cloud Platform
          - Elasticsearch
  - company: Evernote
    roles:
      - position: Software Engineer, Platform
        description: |
          Worked remotely from Portugal with the platform team, re-architecting a 700-shard, multi-terabyte Java monolith to run
          on Kubernetes. This involved many distributed systems problems such as database caching, distributed configuration
          management, scheduling, distributed sessions and load balancing. The goal was faster deployments and elastic scaling
          for Evernote's daily usage peaks across US and India time zones.
        start: Mar, 2022
        end: Feb, 2023
        tech:
          - Java
          - Kubernetes
          -  MySQL
  - company: Natixis
    roles:
      - position: Java Developer, Electronic FX Trading
        description: |
          Allocated to Natixis by Aubay, working remotely from Porto, I worked with the e-forex team on the bank's Spot/Swap/Option
          FX trading platform, building pricing-markup features that process hundreds of pricing events per second.
        start: Apr, 2021
        end: Mar, 2022
        tech:
          - Java
          - SQLServer
          - TIBCO Rendezvous
  - company: Monnos
    roles:
      - position: Backend Engineer
        description: |
          Monnos is a crypto bank with social features. Working remotely from Brazil, I built the news feed microservice from
          scratch, aggregating hundreds of crypto RSS sources into personalized feeds for ~1,000 daily active users. I replaced
          hour-plus manual deployments, which required hands-on intervention and caused downtime, with a fully automated
          GitLab CI/Ansible pipeline with automatic rollback on failure. I also migrated part of the stack to Kubernetes and
          implemented a monitoring solution using Kibana/Grafana.
        start: Sep, 2020
        end: Apr, 2021
        tech:
          - Java
          - Kubernetes
          - Ansible
          - Gitlab CI
  - company: CEFET-MG
    roles:
      - position: High-Performance Computing (HPC) System Administrator
        description: |
          As the administrator of High-Performance Computer, associated with the PPGMMC, I installed and configured an ~800 cores
          HPC based on Rocks Cluster and SLURM. Gave support to technologies such as MPI, OpenMP, CUDA and Hadoop. Also giving support to users,
          helping them to prepare their experiments, compiling and installing software, writing environment modules, and also hardware maintenance.
          Beyond that, I was writing technical reports and supervising a team of two interns.
        start: Apr, 2016
        end: May, 2021
        tech:
         - CentOS
         - Slurm
         - C/C++
         - Python
         - Java
         - MPI
         - OpenMP
         - CUDA
         - Shell Scripting
         - PostgreSQL
         - Cassandra
         - Linux KVM
      - position: Research Assistant (student research scholarship), Intelligent Systems Lab
        description: |
          Funded first by a junior (high-school) and then by an undergraduate research scholarship (BIC-Jr/BIC), I worked
          in a research project that aimed to develop an artificial life simulator, distributed across a cluster.
          The project was called L2L (Live to Learn, Learn to Live), in which was possible to create artificial creatures endowed with
          an artificial nervous system in a virtual world where they could interact and learn to live.
          As a Java developer, I refactored it to a client-server architecture, built its data extraction and analysis layer
          and control UI, and ported it to the Akka actor toolkit, with a PostgreSQL database.
          The experiments were run in an 8 machine cluster, extracting data of lifetime interaction.
          We studied the influence of the learning/action selection algorithm in creatures behaviour over time.
          This work became my B.Sc. thesis and the basis of the OL2A 2022 paper.
        start: 2010
        end: Mar, 2016
        tech:
          - Java
          - Akka
          - PostgreSQL
          - Python
  - company: Centre for Informatics and Systems @ UC
    roles:
      - position: Research Assistant
        description: |
          I worked in the SSE (Software and System Engineering) group supervised by the professor Nuno Antunes,
          on trustworthiness benchmarking for virtualized systems. I built a tool that extracted Xen hypercalls
          from hypervisor logs and analyzed and plotted them over time.
        start: Mar, 2018
        end: Aug, 2018
        tech:
          - C/C++
          - Python
          - Xen

